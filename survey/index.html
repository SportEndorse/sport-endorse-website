<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport Endorse Athlete Brand Survey 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sport Endorse brand v9.0: floodlit navy carries the surface, paper-white carries the reading, kit gold is the single accent. */
:root{
  --bg:#0A1424; --panel:#101D33; --line:#233450; --ink:#E9EDF4; --muted:#93A3BB;
  --gold:#FFCE00; --on-gold:#0A1424; --gold-soft:rgba(255,206,0,.12); --sel:#E9EDF4; --on-sel:#0A1424; --danger:#FF8A80;
  --display:"Archivo","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Spline Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
/* The site is navy-first in every mode, so both schemes keep the brand surface. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0A1424;--panel:#101D33;--line:#233450;--ink:#E9EDF4;--muted:#93A3BB}
}
:root[data-theme="dark"]{--bg:#0A1424;--panel:#101D33;--line:#233450;--ink:#E9EDF4;--muted:#93A3BB}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:20px 18px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{white-space:nowrap;font-family:var(--display);font-weight:500;font-size:22px;letter-spacing:-.01em;color:#fff}
.brand b{font-weight:800}
.logo{display:block;height:auto;width:clamp(150px,42vw,260px);max-width:100%;flex:0 1 auto;min-width:0}
.langs{display:flex;gap:3px;flex-wrap:nowrap}
.langs button{font:600 13px var(--body);border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:4px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}

/* the lane: progress as a running track */
.lane{position:relative;height:30px;margin:6px 0 4px}
.lane .rail{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)}
.lane .fill{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:var(--gold);transition:width .45s cubic-bezier(.3,.7,.2,1)}
.lane .tick{position:absolute;top:10px;width:2px;height:10px;background:var(--bg);transform:translateX(-1px)}
.lane .runner{position:absolute;top:5px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--gold);transform:translateX(-10px);transition:left .45s cubic-bezier(.3,.7,.2,1)}
.lane .finish{position:absolute;right:-2px;top:4px;width:12px;height:22px;background:
  conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/6px 6px;border-radius:2px;opacity:.75}
.stepline{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:26px}

h1,h2{font-family:var(--display);font-weight:800;font-stretch:88%;line-height:1.02;margin:0 0 12px;letter-spacing:-.02em;color:#fff}
h1{font-size:clamp(38px,8.5vw,60px)}
h2{font-size:clamp(30px,6.5vw,42px)}
.lede{font-size:18px;color:var(--muted);max-width:60ch;margin:0 0 26px}
.hint{color:var(--muted);font-size:15px;margin:-4px 0 18px}
.q{font-weight:600;margin:26px 0 10px;font-size:17px}
.q small{font-weight:400;color:var(--muted)}

.countries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.country{display:flex;align-items:center;gap:10px;padding:14px 12px;min-width:0;overflow-wrap:anywhere;hyphens:auto;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:600 17px var(--body);cursor:pointer;text-align:left}
.country .flag{font-size:24px;line-height:1}
.country[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:500 16px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.chip .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--on-gold);font:800 14px var(--display);margin-left:-6px}
.chip.alt[aria-pressed="true"]{background:transparent;color:var(--ink);border-color:var(--ink)}
.chip.alt[aria-pressed="true"]::before{content:"✓";font-weight:700;color:var(--gold)}

/* podium lanes for the ranking */
.podium{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:0 0 18px}
.slot{min-height:64px;border-radius:10px;border:1.5px dashed var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:2px;background:transparent;color:var(--ink);text-align:left;font:500 13px/1.2 var(--body);cursor:default}
.slot .pos{font:800 22px/1 var(--display);color:var(--muted)}
.slot.on{border-style:solid;border-color:var(--gold);background:var(--gold-soft);cursor:pointer}
.slot.on .pos{color:var(--gold)}
.slot .nm{overflow-wrap:anywhere}
@media (max-width:420px){.slot{font-size:12px;min-height:58px}}

.addrow{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=email],select{width:100%;font:500 17px var(--body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
input::placeholder{color:var(--muted)}
input:focus,select:focus,button:focus-visible{outline:3px solid rgba(255,206,0,.55);outline-offset:2px}
.btn{font:700 17px var(--body);border-radius:10px;padding:12px 22px;min-height:48px;border:1.5px solid var(--gold);background:var(--gold);color:var(--on-gold);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:8px 14px;min-height:46px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 15px var(--body);cursor:pointer;padding:8px 0}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tbrand{padding:14px 0;border-top:1px solid var(--line)}
.tbrand:first-of-type{border-top:0}
.tbrand .nm{font-weight:600;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{font:500 13px/1.2 var(--body);padding:8px 4px;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.seg button.love[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}

.navbar{position:fixed;left:0;right:0;bottom:0;background:rgba(10,20,36,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}
.navbar .grow{flex:1}
.err{color:var(--danger);font-size:15px;margin:10px 0 0;min-height:1em}
.note{font-size:14px;color:var(--muted);margin-top:18px}
.done{padding-top:20px}
.done .big{font:900 clamp(64px,16vw,120px)/.9 var(--display);color:var(--gold);margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.lane .fill,.lane .runner{transition:none}}
</style>
</head>

Object.assign(T.fr.nat,{FR:"Votre marque française préférée",BE:"Votre marque belge préférée",NL:"Votre marque néerlandaise préférée",DE:"Votre marque allemande préférée",ES:"Votre marque espagnole préférée"});
Object.assign(T.es.nat,{FR:"Tu marca francesa favorita",BE:"Tu marca belga favorita",NL:"Tu marca neerlandesa favorita",DE:"Tu marca alemana favorita",ES:"Tu marca española favorita"});

const LANGS = [["en","EN"],["fr","FR"],["es","ES"],["nl","NL"],["de","DE"]];

/* ============ STATE ============ */
const params = new URLSearchParams(location.search);
const STORE_KEY = CONFIG.surveyId + ":draft";
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickLang(){const p=(params.get("lang")||navigator.language||"en").slice(0,2).toLowerCase();return T[p]?p:"en"}
function freshState(){
  const s={lang:pickLang(),country:(params.get("country")||"").toUpperCase(),countryOther:"",step:0,startedAt:Date.now(),
    profile:{sportPick:"",sport:"",level:"",gender:"",school:"",division:"",nil:""},age18:false,cats:{},order:{},
    target:{shown:[],ans:{}},campus:[],life:{fashion:"",travel:"",national:"",dream:"",events:[]},sponsors:"",
    consent:{agg:false,fwd:false,prize:false},email:""};
  if(!COUNTRIES.some(c=>c.c===s.country)) s.country="";
  CATS.forEach(k=>s.cats[k]={ranked:[],custom:[],workWith:"",use:[],skipped:false});
  // Sport Endorse Powered brand check: 8 of the 50, half of respondents get 2 fast-yes brands guaranteed
  const pool=LIST_A.concat(LIST_B); let shown;
  if(Math.random()<0.5){const f=shuffle(FAST_YES).slice(0,2);shown=f.concat(shuffle(pool.filter(b=>!f.includes(b))).slice(0,CONFIG.targetSampleSize-2))}
  else shown=shuffle(pool).slice(0,CONFIG.targetSampleSize);
  s.target.shown=shuffle(shown);
  return s;
}
let S=freshState();
try{const d=JSON.parse(localStorage.getItem(STORE_KEY)||"null");if(d&&d.v===2&&d.s&&!d.s.submitted){S=Object.assign(S,d.s);if(params.get("lang")&&T[params.get("lang")])S.lang=params.get("lang")}}catch(e){}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({v:2,s:S}))}catch(e){}}
const t=()=>T[S.lang];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function brandsFor(cat){
  if(!S.order[cat]){const d=BRANDS[cat];S.order[cat]=shuffle(d.base.concat((d.add&&d.add[S.country])||[]))}
  return S.order[cat].concat(S.cats[cat].custom.filter(b=>!S.order[cat].includes(b)));
}
function steps(){return ["welcome","profile"].concat(CATS.map(c=>"cat:"+c),["target","life","consent"])}

/* ============ RENDER ============ */
const $=id=>document.getElementById(id);
function renderLangs(){
  $("langs").innerHTML=LANGS.map(([k,l])=>`<button type="button" data-lang="${k}" aria-pressed="${S.lang===k}" lang="${k}">${l}</button>`).join("");
}
function renderProgress(){
  const st=steps(), i=S.step, n=st.length;
  if(i===0||S.submitted){$("progress").innerHTML="";return}
  const pct=(i/(n-1))*100;
  const ticks=st.map((_,k)=>k>0&&k<n-1?`<span class="tick" style="left:${(k/(n-1))*100}%"></span>`:"").join("");
  const key=st[i]; const label=key.startsWith("cat:")?t().cat[key.slice(4)]:"";
  $("progress").innerHTML=`<div class="lane" aria-hidden="true"><span class="rail"></span><span class="fill" style="width:${pct}%"></span>${ticks}<span class="finish"></span><span class="runner" style="left:${pct}%"></span></div>
  <div class="stepline"><span>${esc(t().step.replace("{n}",i+1).replace("{t}",n))}</span><span>${esc(label)}</span></div>`;
}
function optRow(type,name,value,checked,label){return `<label class="opt"><input type="${type}" name="${name}" value="${esc(value)}" ${checked?"checked":""}><span>${esc(label)}</span></label>`}

function viewWelcome(){
  const L=t();
  return `<h1>${esc(L.intro_h)}</h1><p class="lede">${esc(L.intro_p)}</p>
  <p class="q">${esc(L.country_q)}</p>
  <div class="countries">${COUNTRIES.map(c=>`<button type="button" class="country" data-country="${c.c}" aria-pressed="${S.country===c.c}"><span class="flag" aria-hidden="true">${c.f}</span>${esc(L.cn[c.c])}</button>`).join("")}</div>
  ${S.country==="XX"?`<div style="margin-top:10px"><input type="text" data-bind="countryOther" value="${esc(S.countryOther)}" placeholder="${esc(L.country_other_ph)}" aria-label="${esc(L.country_other_ph)}"></div>`:""}
  <p class="err" id="err"></p>`;
}
function viewProfile(){
  const L=t(),p=S.profile,us=S.country==="US";
  return `<h2>${esc(L.profile_h)}</h2>
  <p class="q">${esc(L.sport_q)}</p>
  <div class="chips" data-radiochip="profile.sportPick">${SPORTS.map(s=>`<button type="button" class="chip" data-v="${s}" aria-pressed="${p.sportPick===s}">${esc(L.sp[s])}</button>`).join("")}<button type="button" class="chip" data-v="other" aria-pressed="${p.sportPick==="other"}">${esc(L.other_sport)}</button></div>
  ${p.sportPick==="other"?`<div style="margin-top:10px"><input id="sport" type="text" data-bind="profile.sport" value="${esc(p.sport)}" placeholder="${esc(L.sport_ph)}" aria-label="${esc(L.other_sport)}" autocomplete="off" maxlength="60"></div>`:""}
  <p class="q">${esc(L.level_q)}</p>
  <div class="opts" data-radio="profile.level">${LEVELS.map(l=>optRow("radio","level",l,p.level===l,L.lv[l])).join("")}</div>
  ${us?`<p class="q"><label for="school">${esc(L.school_q)}</label></p><input id="school" type="text" data-bind="profile.school" value="${esc(p.school)}">
  <div class="row2"><div><p class="q"><label for="div">${esc(L.division_q)}</label></p><select id="div" data-bind="profile.division"><option value=""></option>${DIVISIONS.map(d=>`<option ${p.division===d?"selected":""}>${d}</option>`).join("")}</select></div>
  <div><p class="q">${esc(L.nil_q)}</p><div class="chips" data-radiochip="profile.nil"><button type="button" class="chip" data-v="yes" aria-pressed="${p.nil==="yes"}">${esc(L.yes)}</button><button type="button" class="chip" data-v="no" aria-pressed="${p.nil==="no"}">${esc(L.no)}</button></div></div></div>`:""}
  <p class="q">${esc(L.gender_q)} <small>${esc(L.opt)}</small></p>
  <div class="chips" data-radiochip="profile.gender">${GENDERS.map(g=>`<button type="button" class="chip" data-v="${g}" aria-pressed="${p.gender===g}">${esc(L.gd[g])}</button>`).join("")}</div>
  <div style="margin-top:22px" class="opts"><label class="opt"><input type="checkbox" data-check="age18" ${S.age18?"checked":""}><span>${esc(L.age)}</span></label></div>
  <p class="err" id="err"></p>`;
}
function viewCat(cat){
  const L=t(),c=S.cats[cat],list=brandsFor(cat);
  const slots=[0,1,2,3,4].map(i=>{const b=c.ranked[i];return b?`<button type="button" class="slot on" data-unrank="${esc(b)}" aria-label="${i+1}: ${esc(b)}"><span class="pos">${i+1}</span><span class="nm">${esc(b)}</span></button>`:`<div class="slot"><span class="pos">${i+1}</span></div>`}).join("");
  const chips=list.map(b=>{const r=c.ranked.indexOf(b);return `<button type="button" class="chip" data-rank="${esc(b)}" aria-pressed="${r>-1}">${r>-1?`<span class="n">${r+1}</span>`:""}${esc(b)}</button>`}).join("");
  let follow="";
  if(c.ranked.length){
    follow=`<p class="q">${esc(L.work_q)}</p><div class="chips" data-work="${cat}">${c.ranked.map(b=>`<button type="button" class="chip alt" data-v="${esc(b)}" aria-pressed="${c.workWith===b}">${esc(b)}</button>`).join("")}<button type="button" class="chip alt" data-v="__none" aria-pressed="${c.workWith==="__none"}">${esc(L.none)}</button></div>
    <p class="q">${esc(L.use_q)}</p><div class="chips" data-use="${cat}">${c.ranked.map(b=>`<button type="button" class="chip alt" data-v="${esc(b)}" aria-pressed="${c.use.includes(b)}">${esc(b)}</button>`).join("")}<button type="button" class="chip alt" data-v="__none" aria-pressed="${c.use.includes("__none")}">${esc(L.none)}</button></div>`;
  }
  return `<h2>${esc(L.cat[cat])}</h2><p class="hint">${esc(L.hint[cat])}. ${esc(L.cat_intro)}</p>
  <div class="podium" aria-label="Ranking">${slots}</div>
  <div class="chips" role="group" aria-label="${esc(L.cat[cat])}">${chips}</div>
  <div class="addrow"><input type="text" id="custom" placeholder="${esc(L.other_ph)}" aria-label="${esc(L.other_ph)}" maxlength="60"><button type="button" class="btn ghost small" data-addcustom="${cat}">${esc(L.add)}</button></div>
  ${follow}
  <p><button type="button" class="linkbtn" data-skipcat="${cat}">${esc(L.skip)}</button></p>`;
}
function viewTarget(){
  const L=t(),keys=["never","heard","used","love"];
  const rows=S.target.shown.map(b=>`<div class="tbrand"><div class="nm">${esc(b)}</div><div class="seg" data-tbrand="${esc(b)}">${keys.map(k=>`<button type="button" class="${k==="love"?"love":""}" data-v="${k}" aria-pressed="${S.target.ans[b]===k}">${esc(L.tk[k])}</button>`).join("")}</div></div>`).join("");
  const campus=S.country==="US"?`<p class="q" style="margin-top:34px">${esc(L.campus_q)} <small>${esc(L.upto5)}</small></p><div class="chips" data-campus>${LIST_B.map(b=>`<button type="button" class="chip alt" data-v="${esc(b)}" aria-pressed="${S.campus.includes(b)}">${esc(b)}</button>`).join("")}</div>`:"";
  return `<h2>${esc(L.target_h)}</h2><p class="hint">${esc(L.target_p)}</p>${rows}${campus}`;
}
function viewLife(){
  const L=t(),l=S.life,ev=EVENTS.base.concat(EVENTS.add[S.country]||[]);
  const f=(k,q)=>`<p class="q"><label for="lf_${k}">${esc(q)}</label></p><input id="lf_${k}" type="text" data-bind="life.${k}" value="${esc(l[k])}" maxlength="80">`;
  return `<h2>${esc(L.life_h)}</h2>
  ${f("national",L.nat[S.country||"XX"])}${f("fashion",L.fashion_q)}${f("travel",L.travel_q)}${f("dream",L.dream_q)}
  <p class="q">${esc(L.events_q)} <small>${esc(L.opt)}</small></p>
  <div class="chips" data-events>${ev.map(e=>`<button type="button" class="chip alt" data-v="${esc(e)}" aria-pressed="${l.events.includes(e)}">${esc(e)}</button>`).join("")}</div>`;
}
function viewConsent(){
  const L=t(),c=S.consent,needEmail=!params.get("aid");
  const ck=(k,label)=>`<label class="opt"><input type="checkbox" data-check="consent.${k}" ${c[k]?"checked":""}><span>${esc(label)}</span></label>`;
  return `<h2>${esc(L.consent_h)}</h2>
  <p class="q"><label for="spons">${esc(L.spons_q)}</label> <small>${esc(L.opt)}</small></p>
  <input id="spons" type="text" data-bind="sponsors" value="${esc(S.sponsors)}" placeholder="${esc(L.spons_ph)}" maxlength="200">
  ${needEmail?`<p class="q"><label for="email">${esc(L.email_q)}</label></p><input id="email" type="email" data-bind="email" value="${esc(S.email)}" autocomplete="email">`:""}
  <div class="opts" style="margin-top:24px">${ck("agg",L.c_agg)}${ck("fwd",L.c_fwd)}${ck("prize",L.c_prize)}</div>
  <p class="note">${esc(L.privacy)}</p><p class="err" id="err"></p>`;
}
function viewDone(){
  const L=t();
  return `<div class="done"><div class="big" aria-hidden="true">✓</div><h1>${esc(L.thanks_h)}</h1><p class="lede">${esc(L.thanks_p)}</p>${S.previewOnly?`<p class="note">${esc(L.preview)}</p>`:""}</div>`;
}
function render(keepScroll){
  const y=window.scrollY;
  document.documentElement.lang=S.lang; document.title=t().title;
  renderLangs(); renderProgress();
  const st=steps(),key=st[S.step];
  let html;
  if(S.submitted) html=viewDone();
  else if(key==="welcome") html=viewWelcome();
  else if(key==="profile") html=viewProfile();
  else if(key.startsWith("cat:")) html=viewCat(key.slice(4));
  else if(key==="target") html=viewTarget();
  else if(key==="life") html=viewLife();
  else html=viewConsent();
  $("screen").innerHTML=html;
  const nav=$("navbar"); nav.hidden=!!S.submitted;
  $("backBtn").textContent=t().back; $("backBtn").style.visibility=S.step===0?"hidden":"visible";
  $("nextBtn").textContent=S.step===0?t().start:(S.step===st.length-1?t().submit:t().next);
  $("nextBtn").disabled=false;
  if(keepScroll) window.scrollTo(0,y);
  save();
}

/* ============ INTERACTION ============ */
function setPath(path,val){const p=path.split(".");let o=S;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
function getPath(path){return path.split(".").reduce((o,k)=>o[k],S)}
function toggle(arr,v,max){const i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else if(!max||arr.length<max)arr.push(v);return arr}

document.addEventListener("input",e=>{const b=e.target.dataset.bind;if(b){setPath(b,e.target.value);save()}});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.check){setPath(el.dataset.check,el.checked);save()}
  const r=el.closest("[data-radio]");if(r&&el.type==="radio"){setPath(r.dataset.radio,el.value);save()}
  if(el.dataset.bind&&el.tagName==="SELECT"){setPath(el.dataset.bind,el.value);save()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="custom"){e.preventDefault();document.querySelector("[data-addcustom]")?.click()}});
document.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el)return;
  const ds=el.dataset;
  if(ds.lang){S.lang=ds.lang;S.langManual=true;render(true);return}
  if(ds.country){S.country=ds.country;S.order={};if(!S.langManual&&!params.get("lang")&&COUNTRY_LANG[ds.country])S.lang=COUNTRY_LANG[ds.country];render(true);return}
  const rc=el.closest("[data-radiochip]");if(rc){const k=rc.dataset.radiochip;setPath(k,getPath(k)===ds.v?"":ds.v);render(true);if(k==="profile.sportPick"&&ds.v==="other")$("sport")?.focus();return}
  const key=steps()[S.step],cat=key.startsWith("cat:")?key.slice(4):null;
  if(ds.rank&&cat){const c=S.cats[cat];toggle(c.ranked,ds.rank,5);c.skipped=false;tidy(c);render(true);return}
  if(ds.unrank&&cat){const c=S.cats[cat];toggle(c.ranked,ds.unrank);tidy(c);render(true);return}
  if(ds.addcustom){const inp=$("custom"),v=inp.value.trim().replace(/\s+/g," ");if(!v)return;const c=S.cats[ds.addcustom];
    const existing=brandsFor(ds.addcustom).find(b=>b.toLowerCase()===v.toLowerCase());const name=existing||v;
    if(!existing)c.custom.push(name);if(!c.ranked.includes(name)&&c.ranked.length<5)c.ranked.push(name);c.skipped=false;render(true);return}
  if(ds.skipcat){const c=S.cats[ds.skipcat];c.ranked=[];c.workWith="";c.use=[];c.skipped=true;go(1);return}
  const w=el.closest("[data-work]");if(w){const c=S.cats[w.dataset.work];c.workWith=c.workWith===ds.v?"":ds.v;render(true);return}
  const u=el.closest("[data-use]");if(u){const c=S.cats[u.dataset.use];if(ds.v==="__none")c.use=c.use.includes("__none")?[]:["__none"];else{c.use=c.use.filter(b=>b!=="__none");toggle(c.use,ds.v)}render(true);return}
  const tb=el.closest("[data-tbrand]");if(tb){const b=tb.dataset.tbrand;S.target.ans[b]=S.target.ans[b]===ds.v?undefined:ds.v;render(true);return}
  if(el.closest("[data-campus]")){toggle(S.campus,ds.v,5);render(true);return}
  if(el.closest("[data-events]")){toggle(S.life.events,ds.v);render(true);return}
});
function tidy(c){if(c.workWith&&c.workWith!=="__none"&&!c.ranked.includes(c.workWith))c.workWith="";c.use=c.use.filter(b=>b==="__none"||c.ranked.includes(b))}
function showErr(m){const e=$("err");if(e)e.textContent=m}
function validate(){
  const key=steps()[S.step],L=t();
  if(key==="welcome"&&(!S.country||(S.country==="XX"&&!S.countryOther.trim()))){showErr(L.req_country);return false}
  if(key==="profile"&&(!S.profile.sportPick||(S.profile.sportPick==="other"&&!S.profile.sport.trim())||!S.profile.level||!S.age18)){showErr(L.req_profile);return false}
  if(key==="consent"&&!S.consent.agg){showErr(L.req_consent);return false}
  return true;
}
function go(d){S.step=Math.max(0,Math.min(steps().length-1,S.step+d));render(false);window.scrollTo(0,0);$("screen").querySelector("h1,h2")?.setAttribute("tabindex","-1");$("screen").querySelector("h1,h2")?.focus({preventScroll:true})}
$("backBtn").addEventListener("click",()=>go(-1));
$("nextBtn").addEventListener("click",()=>{if(!validate())return;if(S.step===steps().length-1)submit();else go(1)});

/* ============ SUBMIT ============ */
function payload(){
  const cats={};CATS.forEach(k=>{const c=S.cats[k];cats[k]={ranked:c.ranked.slice(),workWith:c.workWith==="__none"?"none":c.workWith,use:c.use.filter(b=>b!=="__none"),usesNone:c.use.includes("__none"),skipped:c.skipped}});
  const ans={};S.target.shown.forEach(b=>{ans[b]=S.target.ans[b]||""});
  return {v:1,surveyId:CONFIG.surveyId,responseId:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)),
    submittedAt:new Date().toISOString(),durationSec:Math.round((Date.now()-S.startedAt)/1000),
    lang:S.lang,country:S.country,countryOther:S.country==="XX"?S.countryOther.trim():"",
    aid:params.get("aid")||"",src:params.get("src")||"",
    profile:Object.assign({},S.profile,{sport:S.profile.sportPick==="other"?S.profile.sport.trim():S.profile.sportPick,sportOther:S.profile.sportPick==="other"}),
    categories:cats,targetCheck:{shown:S.target.shown.slice(),answers:ans},campusIntl:S.campus.slice(),
    lifestyle:{national:S.life.national.trim(),fashion:S.life.fashion.trim(),travel:S.life.travel.trim(),dream:S.life.dream.trim(),events:S.life.events.slice()},
    sponsors:S.sponsors.trim(),consent:Object.assign({},S.consent),email:S.email.trim()};
}
let dbRef=null;
(async()=>{try{if(window.claude&&window.claude.use)dbRef=await window.claude.use("db")}catch(e){dbRef=null}})();
async function submit(){
  const btn=$("nextBtn");btn.disabled=true;btn.textContent=t().saving;showErr("");
  const data=payload();let stored=false;
  try{
    if(dbRef){await dbRef.collection("responses").doc(data.responseId).set(data);stored=true}
    if(CONFIG.endpoint&&CONFIG.endpoint.startsWith("https://")){const r=await fetch(CONFIG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});if(!r.ok&&r.type!=="opaque")throw new Error("HTTP "+r.status);stored=true}
    if(!stored)console.log("Survey response (preview, not stored):",data);
    S.previewOnly=!stored;S.submitted=true;
    try{localStorage.removeItem(STORE_KEY)}catch(e){}
    render(false);window.scrollTo(0,0);
  }catch(e){console.error(e);btn.disabled=false;btn.textContent=t().submit;showErr(t().err)}
}
render(false);
</script>
</body>
</html>
